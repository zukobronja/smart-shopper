[project]
name = "smartshopper"
version = "0.1.0"
description = "SmartShopper - Product search and comparison with deal alerts"
requires-python = ">=3.12"
dependencies = [
    # FastAPI
    "fastapi>=0.109.1",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.0.3",
    # Database
    "motor>=3.3.2", # Async MongoDB driver
    "pymongo>=4.6.1",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[argon2,bcrypt]>=1.7.4",
    "argon2-cffi>=23.1.0",
    "python-multipart>=0.0.6",
    # AI/ML
    "openai>=1.12.0",
    "sentence-transformers>=2.2.2",
    "torch>=2.1.0",
    "numpy>=1.24.0",
    # Tavily
    "tavily-python>=0.7.6",
    # LangChain/LangGraph
    "langchain>=0.3.25",
    "langchain-openai>=0.3.23",
    "langchain-core>=0.3.65",
    "langgraph>=0.4.8",
    "langchain-tavily>=0.2.6",
    # Web scraping/parsing
    "requests>=2.32.3",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    # RSS/feeds
    "feedparser>=6.0.10",
    # Async utilities
    "aiohttp>=3.9.0",
    "httpx>=0.26.0",
    "google-auth>=2.27.0",
    "google-auth-oauthlib>=1.2.0",
    # Data processing
    "pandas>=2.1.0",
    "python-dateutil>=2.8.2",
    # Environment
    "python-dotenv>=1.1.0",
    # Logging/monitoring
    "structlog>=23.2.0",
    # Email
    "emails>=0.6.0",
    # Validation
    "jsonschema>=4.20.0",
    # Currency/units
    "babel>=2.14.0",
    "pytest-mock>=3.15.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.12.0",
    "httpx>=0.26.0",  # For testing
    "black>=23.12.0",
    "ruff>=0.1.9",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
target-version = "py312"
line-length = 88
select = ["E", "F", "I", "N", "W", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.black]
target-version = ['py312']
line-length = 88

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "backend/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
    "jupyter>=1.1.1",
    "langchain-openai>=0.3.33",
    "langgraph>=0.6.7",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "graphviz>=0.20.1",
    "pyppeteer>=1.0.2",
]
